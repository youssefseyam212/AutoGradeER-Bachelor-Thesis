<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERD Visualizer from GraphML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0f5;
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .structure-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }

        .structure-list h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .entity-item {
            background: white;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .entity-item h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .entity-item ul {
            list-style: none;
            padding-left: 20px;
        }

        .entity-item li {
            padding: 5px 0;
            color: #666;
        }

        .entity-item li.pk {
            color: #667eea;
            font-weight: bold;
        }

        .btn-download {
            background: #28a745;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 20px;
            margin: 10px;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-download:hover {
            background: #218838;
        }

        .relationship-card {
            background: white;
            border-left: 4px solid #764ba2;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .relationship-type {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }

        .relationship-type.one-to-one {
            background-color: #e6f7ff;
            color: #1890ff;
        }

        .relationship-type.one-to-many {
            background-color: #f6ffed;
            color: #52c41a;
        }

        .relationship-type.many-to-many {
            background-color: #fff7e6;
            color: #fa8c16;
        }

        .relationship-type.unknown {
            background-color: #f5f5f5;
            color: #8c8c8c;
        }

        .relationship-details {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        .relationship-entities {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .relationship-entity {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #f0f0f5;
            border-radius: 5px;
            margin: 0 5px;
        }

        .relationship-connector {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .connector-symbol {
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 ERD Visualizer</h1>
            <p>Upload your GraphML file to visualize the Entity-Relationship Diagram</p>
        </div>

        <div class="content">
            <div class="upload-section">
                <input type="file" id="fileInput" accept=".graphml,.xml">
                <label for="fileInput" class="upload-btn">📁 Choose GraphML File</label>
                <p style="margin-top: 20px; color: #666;">or drag and drop your file here</p>
            </div>

            <div id="statsSection" style="display: none;">
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="entityCount">0</h3>
                        <p>Entities</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="attributeCount">0</h3>
                        <p>Attributes</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="relationshipCount">0</h3>
                        <p>Relationships</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="relationshipTypesCount">0</h3>
                        <p>Relationship Types</p>
                    </div>
                </div>

                <div style="text-align: center; margin: 20px 0;">
                    <button class="btn-download" onclick="downloadSQL()">💾 Download SQL</button>
                </div>
            </div>

            <div class="structure-list">
                <h2>📊 Database Structure</h2>
                <div id="structureContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
